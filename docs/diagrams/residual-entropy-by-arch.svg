<svg xmlns="http://www.w3.org/2000/svg" width="960" height="762" viewBox="0 0 960 762" font-family="sans-serif">
  <style>
      .title { font-size: 22px; font-weight: 700; fill: #263238; }
      .sub   { font-size: 13px; fill: #546e7a; }
      .arch  { font-family: monospace; font-size: 13px; fill: #37474f; }
      .val   { font-family: monospace; font-size: 11px; fill: #455a64; }
      .note  { font-size: 11.5px; fill: #607d8b; }
      .axis  { font-size: 11px; fill: #607d8b; }
      .guide { stroke: #cfd8dc; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <rect width="960" height="762" fill="#ffffff"/>
  <text class="title" x="24" y="34">How much kernel address entropy survives, by architecture</text>
  <text class="sub" x="24" y="57">One kernel line, each architecture built from its own upstream defconfig, one machine per architecture, read by an</text>
  <text class="sub" x="24" y="75">unprivileged user at the default vantage. Each bar is what remains of the kernel image base, in bits, given only what</text>
  <text class="sub" x="24" y="93">inference can prove without resting on unsound evidence.</text>
  <line class="guide" x1="190.0" y1="150" x2="190.0" y2="464"/>
  <text class="axis" x="190.0" y="142" text-anchor="middle">0</text>
  <line class="guide" x1="300.0" y1="150" x2="300.0" y2="464"/>
  <text class="axis" x="300.0" y="142" text-anchor="middle">5</text>
  <line class="guide" x1="410.0" y1="150" x2="410.0" y2="464"/>
  <text class="axis" x="410.0" y="142" text-anchor="middle">10</text>
  <line class="guide" x1="520.0" y1="150" x2="520.0" y2="464"/>
  <text class="axis" x="520.0" y="142" text-anchor="middle">15</text>
  <line class="guide" x1="630.0" y1="150" x2="630.0" y2="464"/>
  <text class="axis" x="630.0" y="142" text-anchor="middle">20</text>
  <line class="guide" x1="740.0" y1="150" x2="740.0" y2="464"/>
  <text class="axis" x="740.0" y="142" text-anchor="middle">25</text>
  <line class="guide" x1="850.0" y1="150" x2="850.0" y2="464"/>
  <text class="axis" x="850.0" y="142" text-anchor="middle">30</text>
  <text class="axis" x="178" y="142" text-anchor="end">bits remaining</text>
  <text class="arch" x="168" y="172" text-anchor="end">aarch64</text>
  <rect x="190" y="159" width="682.0" height="18" fill="#2e7d32" opacity="0.85" rx="2"/>
  <text class="val" x="882.0" y="172">31</text>
  <text class="arch" x="168" y="203" text-anchor="end">s390x</text>
  <rect x="190" y="190" width="638.0" height="18" fill="#2e7d32" opacity="0.85" rx="2"/>
  <text class="val" x="838.0" y="203">29</text>
  <text class="arch" x="168" y="234" text-anchor="end">loongarch64</text>
  <rect x="190" y="221" width="352.0" height="18" fill="#2e7d32" opacity="0.85" rx="2"/>
  <text class="val" x="552.0" y="234">16</text>
  <text class="arch" x="168" y="265" text-anchor="end">mips64el</text>
  <rect x="190" y="252" width="308.0" height="18" fill="#2e7d32" opacity="0.85" rx="2"/>
  <text class="val" x="508.0" y="265">14</text>
  <text class="arch" x="168" y="296" text-anchor="end">ppc32</text>
  <rect x="190" y="283" width="308.0" height="18" fill="#2e7d32" opacity="0.85" rx="2"/>
  <text class="val" x="508.0" y="296">14</text>
  <text class="arch" x="168" y="327" text-anchor="end">mips</text>
  <rect x="190" y="314" width="286.0" height="18" fill="#2e7d32" opacity="0.85" rx="2"/>
  <text class="val" x="486.0" y="327">13</text>
  <text class="arch" x="168" y="358" text-anchor="end">mipsel</text>
  <rect x="190" y="345" width="286.0" height="18" fill="#2e7d32" opacity="0.85" rx="2"/>
  <text class="val" x="486.0" y="358">13</text>
  <text class="arch" x="168" y="389" text-anchor="end">riscv64</text>
  <rect x="190" y="376" width="198.0" height="18" fill="#2e7d32" opacity="0.85" rx="2"/>
  <text class="val" x="398.0" y="389">9</text>
  <text class="arch" x="168" y="420" text-anchor="end">x86_64</text>
  <rect x="190" y="407" width="198.0" height="18" fill="#2e7d32" opacity="0.85" rx="2"/>
  <text class="val" x="398.0" y="420">9</text>
  <text class="arch" x="168" y="451" text-anchor="end">i686</text>
  <rect x="190" y="438" width="176.0" height="18" fill="#2e7d32" opacity="0.85" rx="2"/>
  <text class="val" x="376.0" y="451">8</text>
  <line x1="24" y1="496" x2="936" y2="496" stroke="#eceff1" stroke-width="1"/>
  <text class="note" x="24" y="542">Every bar is a single machine rather than an average: one kernel line and one configuration for each architecture, so the bars compare</text>
  <text class="note" x="24" y="559">architectures instead of summarising a fleet. A defconfig is each architecture&#8217;s own upstream default, which is what a stock build gives;</text>
  <text class="note" x="24" y="576">it is not one configuration imposed across all of them, and the default does not agree with itself across architectures:</text>
  <text class="note" x="48" y="597">aarch64, s390x, loongarch64, x86_64, i686 randomise the kernel image from their own defconfig.</text>
  <text class="note" x="48" y="614">mips64el, ppc32, mips, mipsel, riscv64 randomise only because the build enables RELOCATABLE and RANDOMIZE_BASE, which their defaults leave off.</text>
  <text class="note" x="48" y="631">armeb, armv7, powerpc64, ppc64le, riscv32 cannot randomise the kernel image at all on this line, and are not plotted.</text>
  <text class="note" x="24" y="657">A long bar is not evidence of a strong kernel. It records that nothing reachable at this vantage narrowed the starting window: where the</text>
  <text class="note" x="24" y="674">kallsyms and perf routes are both closed the figure is the untouched prior rather than a measured defence. These bound what sound</text>
  <text class="note" x="24" y="691">inference proves, not what an attacker holding another route could reach. Per-vantage and per-configuration figures are the matrix&#8217;s job.</text>
  <text class="note" x="24" y="717">A figure that the evidence does move is a property of the boot that produced it, the ceiling being read off an address that the draw itself</text>
  <text class="note" x="24" y="734">placed, so such a bar is one boot&#8217;s result rather than a constant of the architecture.</text>
</svg>
