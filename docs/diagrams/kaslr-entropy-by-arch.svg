<svg xmlns="http://www.w3.org/2000/svg" width="960" height="558" viewBox="0 0 960 558" font-family="sans-serif">
<style>
  .title { font-size: 22px; font-weight: 700; fill: #263238; }
  .sub   { font-size: 13px; fill: #546e7a; }
  .arch  { font-family: monospace; font-size: 13px; fill: #37474f; }
  .val   { font-family: monospace; font-size: 11.5px; fill: #455a64; }
  .axis  { font-size: 11px; fill: #90a4ae; }
  .note  { font-size: 11.5px; fill: #607d8b; }
  .guide { stroke: #cfd8dc; stroke-width: 1; stroke-dasharray: 3 3; }
</style>
<rect width="960" height="558" fill="#ffffff"/>
<text class="title" x="24" y="34">KASLR entropy by architecture</text>
<text class="sub" x="24" y="57">How many places the kernel base can land, before any leak strips it.</text>
<text class="sub" x="24" y="75">Each bar spans worst case to best case across configurations. Each extra bit doubles the placements.</text>
<line class="guide" x1="148.0" y1="96" x2="148.0" y2="438"/>
<text class="axis" x="148.0" y="90" text-anchor="middle">0</text>
<line class="guide" x1="233.2" y1="96" x2="233.2" y2="438"/>
<text class="axis" x="233.2" y="90" text-anchor="middle">5</text>
<line class="guide" x1="318.5" y1="96" x2="318.5" y2="438"/>
<text class="axis" x="318.5" y="90" text-anchor="middle">10</text>
<line class="guide" x1="403.8" y1="96" x2="403.8" y2="438"/>
<text class="axis" x="403.8" y="90" text-anchor="middle">15</text>
<line class="guide" x1="489.0" y1="96" x2="489.0" y2="438"/>
<text class="axis" x="489.0" y="90" text-anchor="middle">20</text>
<line class="guide" x1="574.2" y1="96" x2="574.2" y2="438"/>
<text class="axis" x="574.2" y="90" text-anchor="middle">25</text>
<line class="guide" x1="659.5" y1="96" x2="659.5" y2="438"/>
<text class="axis" x="659.5" y="90" text-anchor="middle">30</text>
<line class="guide" x1="744.8" y1="96" x2="744.8" y2="438"/>
<text class="axis" x="744.8" y="90" text-anchor="middle">35</text>
<line class="guide" x1="830.0" y1="96" x2="830.0" y2="438"/>
<text class="axis" x="830.0" y="90" text-anchor="middle">40</text>
<text class="axis" x="138" y="90" text-anchor="end">bits</text>
<text class="arch" x="136" y="116" text-anchor="end">s390</text>
<line x1="437.9" y1="112" x2="813.0" y2="112" stroke="#1976d2" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
<text class="val" x="827.0" y="116">17-39 bits</text>
<text class="arch" x="136" y="144" text-anchor="end">arm64</text>
<line x1="454.9" y1="140" x2="659.5" y2="140" stroke="#1976d2" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
<text class="val" x="673.5" y="144">18-30 bits</text>
<text class="arch" x="136" y="172" text-anchor="end">PowerPC32</text>
<line x1="352.6" y1="168" x2="403.8" y2="168" stroke="#1976d2" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
<text class="val" x="417.8" y="172">12-15 bits</text>
<text class="arch" x="136" y="200" text-anchor="end">MIPS32</text>
<line x1="284.4" y1="196" x2="386.7" y2="196" stroke="#1976d2" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
<text class="val" x="400.7" y="200">8-14 bits</text>
<text class="arch" x="136" y="228" text-anchor="end">MIPS64</text>
<line x1="284.4" y1="224" x2="386.7" y2="224" stroke="#1976d2" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
<text class="val" x="400.7" y="228">8-14 bits</text>
<text class="arch" x="136" y="256" text-anchor="end">LoongArch</text>
<line x1="284.4" y1="252" x2="352.6" y2="252" stroke="#1976d2" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
<text class="val" x="366.6" y="256">8-12 bits</text>
<text class="arch" x="136" y="284" text-anchor="end">RISC-V64</text>
<line x1="301.4" y1="280" x2="306.4" y2="280" stroke="#1976d2" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
<text class="val" x="320.4" y="284">~9 bits</text>
<text class="arch" x="136" y="312" text-anchor="end">x86_64</text>
<line x1="250.3" y1="308" x2="301.4" y2="308" stroke="#1976d2" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
<text class="val" x="315.4" y="312">6-9 bits</text>
<text class="arch" x="136" y="340" text-anchor="end">x86_32</text>
<line x1="233.2" y1="336" x2="284.4" y2="336" stroke="#1976d2" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
<text class="val" x="298.4" y="340">5-8 bits</text>
<text class="arch" x="136" y="368" text-anchor="end">PowerPC64</text>
<line x1="148.0" y1="364" x2="830.0" y2="364" stroke="#eceff1" stroke-width="11" stroke-linecap="round"/>
<text class="val" x="160.0" y="368" fill="#90a4ae">no KASLR in mainline</text>
<text class="arch" x="136" y="396" text-anchor="end">RISC-V32</text>
<line x1="148.0" y1="392" x2="830.0" y2="392" stroke="#eceff1" stroke-width="11" stroke-linecap="round"/>
<text class="val" x="160.0" y="396" fill="#90a4ae">no KASLR in mainline</text>
<text class="arch" x="136" y="424" text-anchor="end">arm32</text>
<line x1="148.0" y1="420" x2="830.0" y2="420" stroke="#eceff1" stroke-width="11" stroke-linecap="round"/>
<text class="val" x="160.0" y="424" fill="#90a4ae">no KASLR in mainline</text>
<text class="note" x="24" y="466">Best and worst case across configurations, with KASLR enabled. The configs that set an end: arm64's low end is VA_BITS 36 and its high end VA_BITS 48, with the</text>
<text class="note" x="24" y="483">VA_BITS 39 common on Android giving about 21; s390 reaches 39 only on 4-level paging, which CONFIG_KASAN alone selects; mips32 reaches 14 only with EVA;</text>
<text class="note" x="24" y="500">x86 spans CONFIG_PHYSICAL_ALIGN, 2 MiB to 16 MiB. What survives a given vantage is a separate question, answered by the residual matrix in</text>
<text class="note" x="24" y="517">reproducibility.md.</text>
</svg>