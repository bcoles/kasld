<svg xmlns="http://www.w3.org/2000/svg" width="960" height="398" viewBox="0 0 960 398" font-family="sans-serif">
  <style>
      .title { font-size: 22px; font-weight: 700; fill: #1b5e20; }
      .sub   { font-size: 13px; fill: #546e7a; }
      .lbl   { font-family: monospace; font-size: 13px; fill: #37474f; }
      .val   { font-family: monospace; font-size: 11.5px; fill: #455a64; }
      .inbar { font-size: 11.5px; font-weight: 700; }
      .note  { font-size: 11.5px; fill: #607d8b; }
      .axis  { font-size: 11px; fill: #607d8b; }
      .guide { stroke: #cfd8dc; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <rect width="960" height="398" fill="#ffffff"/>
  <text class="title" x="24" y="34">Virtual memory split (vmsplit) on 32-bit</text>
  <text class="sub" x="24" y="57">PAGE_OFFSET is the user/kernel boundary in a 4 GiB address space. Everything above it - kernel text,</text>
  <text class="sub" x="24" y="75">the direct map, and on some architectures the module region - shifts with the split.</text>
  <line class="guide" x1="150.0" y1="116" x2="150.0" y2="348"/>
  <text class="axis" x="150.0" y="110" text-anchor="middle">0 GiB</text>
  <line class="guide" x1="302.5" y1="116" x2="302.5" y2="348"/>
  <text class="axis" x="302.5" y="110" text-anchor="middle">1 GiB</text>
  <line class="guide" x1="455.0" y1="116" x2="455.0" y2="348"/>
  <text class="axis" x="455.0" y="110" text-anchor="middle">2 GiB</text>
  <line class="guide" x1="607.5" y1="116" x2="607.5" y2="348"/>
  <text class="axis" x="607.5" y="110" text-anchor="middle">3 GiB</text>
  <line class="guide" x1="760.0" y1="116" x2="760.0" y2="348"/>
  <text class="axis" x="760.0" y="110" text-anchor="middle">4 GiB</text>
  <text class="lbl" x="136" y="148.0" text-anchor="end">1G/3G</text>
  <rect x="150.0" y="132" width="152.5" height="24" fill="#eceff1" stroke="#b0bec5" stroke-width="1"/>
  <rect x="302.5" y="132" width="457.5" height="24" fill="#2e7d32" opacity="0.82" stroke="#1b5e20" stroke-width="1"/>
  <text class="inbar" x="226.2" y="148.0" text-anchor="middle" fill="#546e7a">user 1 GiB</text>
  <text class="inbar" x="531.2" y="148.0" text-anchor="middle" fill="#ffffff">kernel 3 GiB</text>
  <line x1="302.5" y1="127" x2="302.5" y2="161" stroke="#e65100" stroke-width="2.5"/>
  <text class="val" x="774" y="148.0">0x40000000</text>
  <text class="note" x="154" y="170">Rare</text>
  <text class="lbl" x="136" y="194.0" text-anchor="end">2G(opt)/2G</text>
  <rect x="150.0" y="178" width="285.9" height="24" fill="#eceff1" stroke="#b0bec5" stroke-width="1"/>
  <rect x="435.9" y="178" width="324.1" height="24" fill="#2e7d32" opacity="0.82" stroke="#1b5e20" stroke-width="1"/>
  <text class="inbar" x="293.0" y="194.0" text-anchor="middle" fill="#546e7a">user 1.875 GiB</text>
  <text class="inbar" x="598.0" y="194.0" text-anchor="middle" fill="#ffffff">kernel 2.125 GiB</text>
  <line x1="435.9" y1="173" x2="435.9" y2="207" stroke="#e65100" stroke-width="2.5"/>
  <text class="val" x="774" y="194.0">0x78000000</text>
  <text class="note" x="154" y="216">x86_32 only</text>
  <text class="lbl" x="136" y="240.0" text-anchor="end">2G/2G</text>
  <rect x="150.0" y="224" width="305.0" height="24" fill="#eceff1" stroke="#b0bec5" stroke-width="1"/>
  <rect x="455.0" y="224" width="305.0" height="24" fill="#2e7d32" opacity="0.82" stroke="#1b5e20" stroke-width="1"/>
  <text class="inbar" x="302.5" y="240.0" text-anchor="middle" fill="#546e7a">user 2 GiB</text>
  <text class="inbar" x="607.5" y="240.0" text-anchor="middle" fill="#ffffff">kernel 2 GiB</text>
  <line x1="455.0" y1="219" x2="455.0" y2="253" stroke="#e65100" stroke-width="2.5"/>
  <text class="val" x="774" y="240.0">0x80000000</text>
  <text class="note" x="154" y="262">Common on embedded ARM</text>
  <text class="lbl" x="136" y="286.0" text-anchor="end">3G(opt)/1G</text>
  <rect x="150.0" y="270" width="419.4" height="24" fill="#eceff1" stroke="#b0bec5" stroke-width="1"/>
  <rect x="569.4" y="270" width="190.6" height="24" fill="#2e7d32" opacity="0.82" stroke="#1b5e20" stroke-width="1"/>
  <text class="inbar" x="359.7" y="286.0" text-anchor="middle" fill="#546e7a">user 2.75 GiB</text>
  <text class="inbar" x="664.7" y="286.0" text-anchor="middle" fill="#ffffff">kernel 1.25 GiB</text>
  <line x1="569.4" y1="265" x2="569.4" y2="299" stroke="#e65100" stroke-width="2.5"/>
  <text class="val" x="774" y="286.0">0xB0000000</text>
  <text class="note" x="154" y="308">x86_32 only</text>
  <text class="lbl" x="136" y="332.0" text-anchor="end">3G/1G</text>
  <rect x="150.0" y="316" width="457.5" height="24" fill="#eceff1" stroke="#b0bec5" stroke-width="1"/>
  <rect x="607.5" y="316" width="152.5" height="24" fill="#2e7d32" opacity="0.82" stroke="#1b5e20" stroke-width="1"/>
  <text class="inbar" x="378.8" y="332.0" text-anchor="middle" fill="#546e7a">user 3 GiB</text>
  <text class="inbar" x="683.8" y="332.0" text-anchor="middle" fill="#ffffff">kernel 1 GiB</text>
  <line x1="607.5" y1="311" x2="607.5" y2="345" stroke="#e65100" stroke-width="2.5"/>
  <text class="val" x="774" y="332.0">0xC0000000</text>
  <text class="note" x="154" y="354">Default for most distros</text>
  <line x1="24" y1="364" x2="936" y2="364" stroke="#eceff1" stroke-width="1"/>
  <line x1="26" y1="374" x2="26" y2="388" stroke="#e65100" stroke-width="2.5"/>
  <text class="note" x="40" y="385">PAGE_OFFSET - the split itself</text>
  <rect x="250" y="375" width="24" height="11" fill="#eceff1" stroke="#b0bec5"/>
  <text class="note" x="282" y="385">userspace</text>
  <rect x="372" y="375" width="24" height="11" fill="#2e7d32" opacity="0.82"/>
  <text class="note" x="404" y="385">kernel</text>
</svg>
