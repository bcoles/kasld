  <text class="axis" x="800.0" y="128" text-anchor="middle">2027</text>
  <text class="arch" x="136" y="154" text-anchor="end">x86_32</text>
  <text class="val" x="195.1" y="154" text-anchor="end">v3.14</text>
  <line x1="207.1" y1="150" x2="364.7" y2="150" stroke="#ffe0b2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="207.1" cy="150" r="6" fill="#ffffff" stroke="#e65100" stroke-width="2.5"/>
  <text class="val" x="364.7" y="140" text-anchor="middle" fill="#2e7d32">v4.12</text>
