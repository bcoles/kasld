  <text class="arch" x="136" y="346" text-anchor="end">PowerPC32</text>
  <text class="val" x="468.0" y="346" text-anchor="end">v5.5</text>
  <line x1="480.0" y1="342" x2="800" y2="342" stroke="#ffe0b2" stroke-width="3" stroke-linecap="round"/>
