  <text class="arch" x="136" y="282" text-anchor="end">MIPS64</text>
  <text class="val" x="311.0" y="282" text-anchor="end">v4.7</text>
  <line x1="323.0" y1="278" x2="800" y2="278" stroke="#ffe0b2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="323.0" cy="278" r="6" fill="#ffffff" stroke="#e65100" stroke-width="2.5"/>
  <text class="val" x="812" y="282" fill="#e65100">off by default</text>
  <text class="arch" x="136" y="314" text-anchor="end">s390</text>
