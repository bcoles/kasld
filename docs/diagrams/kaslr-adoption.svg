<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" font-family="sans-serif">
  <style>
      .title { font-size: 22px; font-weight: 700; fill: #1b5e20; }
      .sub   { font-size: 13px; fill: #546e7a; }
      .arch  { font-family: monospace; font-size: 13px; fill: #37474f; }
      .val   { font-family: monospace; font-size: 11.5px; fill: #455a64; }
      .note  { font-size: 11.5px; fill: #607d8b; }
      .axis  { font-size: 11px; fill: #607d8b; }
      .guide { stroke: #cfd8dc; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <rect width="960" height="544" fill="#ffffff"/>
  <text class="title" x="24" y="34">When each architecture gained KASLR, and when it was turned on</text>
  <text class="sub" x="24" y="57">Upstream mainline. The pale segment is the stretch where the support existed but a stock build still shipped it</text>
  <text class="sub" x="24" y="75">off; the green segment begins where KASLR became the default. Four architectures have never left the pale segment.</text>
  <line class="guide" x1="172.0" y1="134" x2="172.0" y2="426"/>
