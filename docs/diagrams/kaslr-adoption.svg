  <text class="val" x="639.0" y="410" text-anchor="end">v6.6</text>
  <line x1="651.0" y1="406" x2="800" y2="406" stroke="#ffe0b2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="651.0" cy="406" r="6" fill="#ffffff" stroke="#e65100" stroke-width="2.5"/>
