  <line x1="24" y1="452" x2="936" y2="452" stroke="#eceff1" stroke-width="1"/>
  <line x1="24" y1="472" x2="56" y2="472" stroke="#ffe0b2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="30" cy="472" r="6" fill="#ffffff" stroke="#e65100" stroke-width="2.5"/>
  <text class="note" x="66" y="476">support added, but shipped off by default</text>
  <line x1="330" y1="472" x2="362" y2="472" stroke="#c8e6c9" stroke-width="3" stroke-linecap="round"/>
  <circle cx="336" cy="472" r="6" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
  <text class="note" x="372" y="476">on by default from here</text>
  <text class="note" x="24" y="500">s390 is the only architecture that shipped KASLR on from the release that introduced it; x86 waited three and a half</text>
  <text class="note" x="24" y="516">years, arm64 over three, and LoongArch six months. Architectures with no KASLR support in mainline at all: arm32,</text>
  <text class="note" x="24" y="532">PowerPC64, sparc, SuperH (sh), m68k, MicroBlaze, OpenRISC, RISC-V32.</text>
