<text x="60" y="68" font-family="sans-serif" font-size="33" font-weight="bold" fill="#263238">KASLR — the kernel lands somewhere different every boot</text>
<text x="60" y="106" font-family="sans-serif" font-size="19" fill="#546e7a">Same kernel image, same binary. The base is chosen at boot from a window of aligned slots inside the kernel&#8217;s region.</text>
<text x="230" y="148" font-family="sans-serif" font-size="16" fill="#90a4ae" text-anchor="middle">user space</text>
<text x="840" y="148" font-family="sans-serif" font-size="16" fill="#1976d2" text-anchor="middle">kernel region</text>
<text x="60" y="195" font-family="sans-serif" font-size="19" fill="#37474f">boot 1</text>
