<text x="768.6" y="369" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">kernel</text>
<line x1="340.0" y1="440" x2="1340.0" y2="440" stroke="#1976d2"/>
<line x1="340.0" y1="440" x2="340.0" y2="431" stroke="#1976d2"/>
<line x1="1340.0" y1="440" x2="1340.0" y2="431" stroke="#1976d2"/>
<text x="840" y="466" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#1976d2">KASLR window: every slot the base may occupy</text>
<text x="340" y="466" font-family="sans-serif" font-size="14" fill="#90a4ae" text-anchor="start">lower address</text>
<text x="1340" y="466" font-family="sans-serif" font-size="14" fill="#90a4ae" text-anchor="end">higher address</text>
<text x="230" y="466" font-family="sans-serif" font-size="14" fill="#90a4ae" text-anchor="middle">not to scale</text>
<rect x="60" y="546" width="620" height="368" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
<text x="92" y="590" font-family="sans-serif" font-size="21" font-weight="bold" fill="#263238">How many places? The architecture sets the window</text>
<text x="92" y="622" font-family="sans-serif" font-size="17" fill="#37474f">x86_64 as an example — one source tree, two real build configurations:</text>
<text x="92" y="662" font-family="sans-serif" font-size="16" font-weight="bold" fill="#546e7a">x86_64 build</text>
<text x="400" y="662" font-family="sans-serif" font-size="16" font-weight="bold" fill="#546e7a">slots</text>
<text x="520" y="662" font-family="sans-serif" font-size="16" font-weight="bold" fill="#546e7a">entropy</text>
<line x1="92" y1="672" x2="648" y2="672" stroke="#cfd8dc"/>
<text x="92" y="702" font-family="sans-serif" font-size="17" fill="#37474f">2 MiB alignment (default)</text>
<text x="400" y="702" font-family="monospace" font-size="17" fill="#263238">505</text>
<text x="520" y="702" font-family="monospace" font-size="17" fill="#263238">~9 bits</text>
<text x="92" y="736" font-family="sans-serif" font-size="17" fill="#37474f">16 MiB alignment</text>
<text x="400" y="736" font-family="monospace" font-size="17" fill="#263238">64</text>
<text x="520" y="736" font-family="monospace" font-size="17" fill="#263238">6 bits</text>
<text x="92" y="782" font-family="sans-serif" font-size="15" fill="#546e7a">Coarser alignment does not shrink the window; it thins the slots inside it.</text>
<text x="92" y="826" font-family="sans-serif" font-size="15" fill="#546e7a">Every architecture with KASLR behaves this way; only the window, alignment</text>
<text x="92" y="848" font-family="sans-serif" font-size="15" fill="#546e7a">and slot count differ — from ~8 bits to ~30 bits. Some architectures have</text>
<text x="92" y="870" font-family="sans-serif" font-size="15" fill="#546e7a">no KASLR, and the load address is then the bootloader&#8217;s choice.</text>
<rect x="720" y="546" width="620" height="368" rx="6" fill="#f3e5f5" stroke="#7b1fa2"/>
<text x="752" y="590" font-family="sans-serif" font-size="21" font-weight="bold" fill="#263238">Why it matters</text>
<text x="752" y="628" font-family="sans-serif" font-size="17" fill="#37474f">Every kernel address an exploit uses derives from</text>
<text x="752" y="652" font-family="sans-serif" font-size="17" fill="#37474f">the base, whichever strategy it takes:</text>
<text x="752" y="700" font-family="sans-serif" font-size="17" fill="#37474f"><tspan fill="#7b1fa2">&#183;</tspan> <tspan font-weight="bold">control-flow reuse</tspan> — the gadget and function</text>
<text x="770" y="724" font-family="sans-serif" font-size="17" fill="#37474f">addresses a ROP chain calls</text>
<text x="752" y="772" font-family="sans-serif" font-size="17" fill="#37474f"><tspan fill="#7b1fa2">&#183;</tspan> <tspan font-weight="bold">data-only</tspan> — the address of a global to</text>
<text x="770" y="796" font-family="sans-serif" font-size="17" fill="#37474f">overwrite, such as modprobe_path or core_pattern</text>
<text x="752" y="844" font-family="sans-serif" font-size="17" fill="#37474f">The image moves as one block, so one leaked</text>
<text x="752" y="868" font-family="sans-serif" font-size="17" fill="#37474f">address resolves every symbol at once.</text>
<text x="60" y="982" font-family="sans-serif" font-size="14" fill="#90a4ae">The block is the kernel image; its left edge is the base address KASLR chooses. Slot counts are upper bounds:</text>
<text x="60" y="1004" font-family="sans-serif" font-size="14" fill="#90a4ae">placements where the image would extend past the end of the window are refused. Where KASLR is disabled or</text>
<text x="60" y="1026" font-family="sans-serif" font-size="14" fill="#90a4ae">randomisation fails at boot, the image lands at a fixed or firmware-chosen position instead.</text>
</g>
</svg>