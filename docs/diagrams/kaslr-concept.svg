<text x="554.3" y="193" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">kernel</text>
<text x="60" y="283" font-family="sans-serif" font-size="19" fill="#37474f">boot 2</text>
