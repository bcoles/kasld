<rect x="340.0" y="336" width="1000.0" height="54" rx="3" fill="#e3f2fd" stroke="#90caf9"/>
<line x1="411.4" y1="344" x2="411.4" y2="382" stroke="#90caf9"/>
<line x1="482.9" y1="344" x2="482.9" y2="382" stroke="#90caf9"/>
