<text x="1125.7" y="281" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">kernel</text>
<text x="60" y="371" font-family="sans-serif" font-size="19" fill="#37474f">boot 3</text>
<rect x="160.0" y="336" width="140.0" height="54" rx="3" fill="#eceff1" stroke="#cfd8dc"/>
<path d="M 314 340 l 11 12 l -11 13 l 11 13 l -11 12" fill="none" stroke="#90a4ae" stroke-width="2"/>
