name: replay

# Manual end-to-end replay across all architectures under qemu-user.
#
# The per-push CI (build.yml) already cross-compiles every arch and replays its
# fixtures under emulation on the pinned toolchain. This workflow re-runs that
# full matrix on demand against a chosen cross-toolchain release: trigger it from
# the Actions tab ("Run workflow") to validate a newer toolchain before bumping
# the per-push pin.
#
# It reuses _cross-build.yml — the single source of the arch matrix and the
# toolchain fetch — with run_replay=true, so the build and the replay happen in
# the same per-arch job (no artifact shuffling) and the arch set can't drift from
# the release build.

on:
  workflow_dispatch:
    inputs:
      toolchain_version:
        description: 'cross-tools/musl-cross release tag to build against'
        required: false
        default: '20260515'
        type: string

jobs:
  replay:
    uses: ./.github/workflows/_cross-build.yml
    with:
      toolchain_version: ${{ inputs.toolchain_version }}
      package: false
      run_replay: true
